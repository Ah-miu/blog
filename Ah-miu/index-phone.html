<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ah-miu — phone view</title>
<style>
  :root {
    --sw: 402px;                 
    --sh: 874px;
    --bar: 54px;                 
    --bezel: 14px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: var(--font); color: #e9e6e0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(70% 60% at 50% 45%, #1d1d21, #0b0b0d 70%);
  }
  .device {
    position: relative; flex: none; width: calc(var(--sw) + 2 * var(--bezel)); height: calc(var(--sh) + 2 * var(--bezel));
    padding: var(--bezel); border-radius: 68px; background: #050505;
    box-shadow:
      0 0 0 2px #3a3a3e, 0 0 0 4px #1a1a1c,
      0 40px 90px -30px rgba(0, 0, 0, 0.9);
    transform-origin: center center;
  }
  .screen { position: relative; width: var(--sw); height: var(--sh); overflow: hidden; border-radius: 55px; background: #000; }
  .status {
    position: absolute; left: 0; right: 0; top: 0; height: var(--bar); z-index: 2;
    display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 52px;
    background: #000; color: #fff; font-size: 17px; font-weight: 600; letter-spacing: -0.01em;
  }
  .status .icons { display: flex; align-items: center; gap: 6px; }
  .status svg { display: block; }
  .island {
    position: absolute; left: 50%; top: 11px; width: 126px; height: 37px; margin-left: -63px; border-radius: 20px;
    background: #000; z-index: 3;
  }
  .page {
    position: absolute; left: 0; top: var(--bar); width: var(--sw); height: calc(var(--sh) - var(--bar));
    border: 0; display: block; background: #000;
  }
  .home-bar {
    position: absolute; left: 50%; bottom: 8px; width: 140px; height: 5px; margin-left: -70px; border-radius: 3px;
    background: rgba(255, 255, 255, 0.82); z-index: 2; pointer-events: none;
  }
  .note { margin: 18px 0 0; font-size: 13px; color: rgba(233, 230, 224, 0.45); text-align: center; }
</style>
</head>
<body>

<div class="device" id="device">
  <div class="screen">
    <div class="status">
      <span>9:41</span>
      <span class="icons" aria-hidden="true">
        <svg width="19" height="12" viewBox="0 0 19 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff"><path d="M8.5 2.3c2.3 0 4.4.9 6 2.4l1.2-1.2A10.2 10.2 0 0 0 8.5.6 10.2 10.2 0 0 0 1.3 3.5l1.2 1.2a8.5 8.5 0 0 1 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.2a6.8 6.8 0 0 0-9.6 0l1.2 1.2c1-.9 2.2-1.4 3.6-1.4zm0 3.4c.5 0 1 .2 1.3.5L8.5 11 7.2 9.6c.3-.3.8-.5 1.3-.5z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="#fff" stroke-opacity="0.4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#fff"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#fff" fill-opacity="0.45"/></svg>
      </span>
    </div>
    <div class="island" aria-hidden="true"></div>
    <iframe class="page" id="page" title="Ah-miu on a phone"></iframe>
    <div class="home-bar" aria-hidden="true"></div>
  </div>
</div>
<p class="note" id="note">iPhone 16 Pro · 402 × 874 · scroll over the screen</p>

<script>
(() => {
  const device = document.getElementById('device'), note = document.getElementById('note');
  const page = document.getElementById('page');
  page.src = 'index.html' + location.hash;
  addEventListener('hashchange', () => { page.src = 'index.html' + location.hash; });

  function fit() {
    const w = device.offsetWidth, h = device.offsetHeight;
    const s = Math.min(1, (innerHeight - note.offsetHeight - 56) / h, (innerWidth - 32) / w);
    device.style.transform = `scale(${s.toFixed(4)})`;
    device.style.margin = `${((s - 1) * h / 2).toFixed(1)}px ${((s - 1) * w / 2).toFixed(1)}px`;
  }
  addEventListener('resize', fit);
  fit();
})();
</script>
</body>
</html>
